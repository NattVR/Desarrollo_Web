    <div class="pantalla">
        <div class="titulo">
            <h1>Battlefield</h1>
        </div>

        <section class="juego">
            
                <div class="jugador1">
                    
                    <div class="fila">
                        <h3>JUGADOR 1</h3>  
                    </div>

                    <div class="fila">
                        <label>Vida</label>
                        <input [value]="vidaJugador1()" [min]="0" [max]="100" type="range">
                    </div>
                    
                    <div class="ataque">
                        <div class="botones">
                            <button class="btnjugador1" (click)="Atacar()">Bomba</button>
                            <button class="btnjugador1" (click)="Atacar()">Rifle</button>
                            <button class="btnjugador1" (click)="Atacar()">Granada</button>
                        </div>

                        <img src="assets/personaje02.gif">
                        <div class="daño"></div>
                    </div>
                    
                </div>

                <div class="jugador2">
                    
                    <div class="fila">
                        <h3>JUGADOR 2</h3>  
                    </div>

                    <div class="fila">
                         <label>Vida</label>
                        <input [value]="vidaJugador2()" [min]="0" [max]="100" type="range">    
                    </div>
                    
                    <div class="ataque">
                        <img src="assets/jugador1.gif">
                        <div class="daño"></div>

                        <div class="botones">
                            <button class="btnjugador2" (click)="Atacar()">Bomba</button>
                            <button class="btnjugador2" (click)="Atacar()">Rifle</button>
                            <button class="btnjugador2" (click)="Atacar()">Granada</button>
                        </div>

                    </div>
                    
                </div>        
        </section>
    </div>

<router-outlet />
