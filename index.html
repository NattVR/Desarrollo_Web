<!DOCTYPE html>
<html >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battlefield</title>
    <link rel="stylesheet" href="style.css">   
</head>
<body>

    <div class="pantalla">
        <div class="titulo">
            <h1>Battlefield</h1>
        </div>

        <section class="juego">
            
                <div class="jugador1">
                    
                    <div class="fila">
                        <h3>JUGADOR 1</h3>  
                        <input type="text" id="nombre_jugador1" >
                    </div>

                    <div class="fila">
                        <label>Vida</label>
                        <input type="range" min="0" max="100" value="100" class="vida_jugador1">
                    </div>
                    
                    <div class="ataque">
                        <div class="botones">
                            <button class="btnjugador1" onclick="atacar()" >Bomba</button>
                            <button class="btnjugador1" onclick="atacar()">Rifle</button>
                            <button class="btnjugador1" onclick="atacar()">Granada</button>
                        </div>

                        <img src="imagenes/personaje02.gif">
                        <div class="daño"></div>
                    </div>
                    
                </div>

                <div class="jugador2">
                    
                    <div class="fila">
                        <input type="text" id="nombre_jugador2" >
                        <h3>JUGADOR 2</h3>  
                    </div>

                    <div class="fila">
                        <input type="range" min="0" max="100" value="100" class="vida_jugador2">    
                    </div>
                    
                    <div class="ataque">
                        <img src="imagenes/jugador1.gif">
                        <div class="daño"></div>

                        <div class="botones">
                            <button class="btnjugador2" onclick="atacar()" >Bomba</button>
                            <button class="btnjugador2" onclick="atacar()">Rifle</button>
                            <button class="btnjugador2" onclick="atacar()">Granada</button>
                        </div>                       

                    </div>
                    
                </div>        
        </section>
    </div>

    <script>
        let jugador1 = {
            nombre: "",
            vida: 100
        }

        let jugador2 = {
            nombre: "",
            vida: 100
        }

        window.alert("Bienvenido a Battlafield, el juego de batalla entre dos jugadores.\n" +
        "Cada jugador tiene 100 puntos de vida y puede atacar al otro jugador con diferentes armas.\n" +
        "El primer jugador en reducir la vida del oponente a 0 gana el juego.");

        function validarNombre() {
            jugador1.nombre = window.prompt("Ingrese el nombre del jugador 1");
            document.getElementById("nombre_jugador1").value = jugador1.nombre;

            jugador2.nombre =window.prompt("Ingrese el nombre del jugador 2"+jugador2.nombre);
            document.getElementById("nombre_jugador2").value = jugador2.nombre;  
        }
        
        validarNombre();

        if (jugador1.nombre === "" || jugador2.nombre === ""|| jugador1.nombre ===null || jugador2.nombre ===null) {
            validarNombre();
        };
    
        let turno =Math.floor(Math.random() * 2) + 1;
        alert("Comienza el turno del jugador: " + (turno == 1 ? jugador1.nombre : jugador2.nombre)); 

        function bloquearBotones(turnoActual) {
            document.querySelectorAll(".btnjugador1").forEach(btn => btn.disabled = turnoActual !== 1);
            document.querySelectorAll(".btnjugador2").forEach(btn => btn.disabled = turnoActual !== 2);
        }   

        bloquearBotones(turno);

        function atacar(){
            let ataque = Math.floor(Math.random()*100);
            console.log("ataque"+ataque);

            if (turno == 1) {
                jugador2.vida -= ataque;
                document.querySelector(".vida_jugador2").value = jugador2.vida;
                alert(jugador1.nombre + " ataca a " + jugador2.nombre + " con " + ataque + " de daño.");
                mostrarExplosion(2); 
            } else {
                jugador1.vida -= ataque;
                document.querySelector(".vida_jugador1").value = jugador1.vida;
                alert(jugador2.nombre + " ataca a " + jugador1.nombre + " con " + ataque + " de daño.");
                mostrarExplosion(1);
            }

            if (turno === 1) {
                turno = 2;
            } else {
                turno = 1;
            }

            bloquearBotones(turno);
            window.alert("Turno del jugador: " + (turno == 1 ? jugador1.nombre : jugador2.nombre));
            
            if (jugador2.vida <= 0) {
                alert("¡¡GANASTE!! "+jugador1.nombre );
                resetGame();
            }
            if (jugador1.vida <= 0) {
                alert("¡¡GANASTE!! "+jugador2.nombre );
                resetGame();
            }  
        }

        function resetGame() {
            alert("El juego terminó. Reiniciando...");
            jugador1.vida = 100;
            jugador2.vida = 100;
            document.querySelector(".vida_jugador1").value = jugador1.vida;
            document.querySelector(".vida_jugador2").value = jugador2.vida;
            turno = Math.floor(Math.random() * 2) + 1;
            bloquearBotones(turno);           
        }

        function mostrarExplosion(jugador) {
            let jugadorataque = document.querySelector(`.jugador${jugador}`);
            let explosion = jugadorataque.querySelector(".daño");
        
            explosion.innerHTML = `<img src="../imagenes/explosion.gif">`;
            explosion.style.display = "block"; 

            setTimeout(() => {
                explosion.style.display = "none";
            }, 3000);
        }

    </script>
</body>
</html>
